<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add/Edit Book</title>
</head>
<body>
    <h2 th:text="${book.id == null ? 'Add Book' : 'Edit Book'}"></h2>
    <form th:action="@{/books}" th:object="${book}" method="post">
        <input type="hidden" th:field="*{id}" />
        Title: <input type="text" th:field="*{title}" required/><br/>
        Author: <input type="text" th:field="*{author}" required/><br/>
        Borrowed: <input type="checkbox" th:field="*{borrowed}" id="borrowedCheckbox"/><br/>
        Borrowed By (User ID): 
        <select th:field="*{borrowedBy.id}" id="borrowedBySelect">
            <option th:value="''">-- None --</option>
            <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.name}"></option>
        </select><br/>
        <button type="submit">Save</button>
    </form>

    <script>
        const checkbox = document.getElementById("borrowedCheckbox");
        const select = document.getElementById("borrowedBySelect");

        function toggleBorrowedBy() {
            if (!checkbox.checked) {
                select.value = "";
            }
        }
        
        function toggleBorrowedSelect() {
        	if (!select.value) {
        		checkbox.checked = false;
        	}
        }

        checkbox.addEventListener("change", toggleBorrowedBy);
        select.addEventListener("change", toggleBorrowedSelect);
    </script>
</body>
</html>
