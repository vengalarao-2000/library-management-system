<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>User</title></head>
<body>
    <h2>User List</h2>
    <a th:href="@{/users/new}">Add User</a>
    <table>
        <tr><th>Id</th><th>Name</th></tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>            
        </tr>
    </table>
</body>
</html>
